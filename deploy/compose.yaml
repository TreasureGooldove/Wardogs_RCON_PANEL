services:
  panel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: wardogs-rcon-panel:local
    container_name: wardogs-rcon-panel
    restart: unless-stopped
    init: true
    env_file:
      - ./panel.env
    environment:
      PANEL_DB_PATH: /var/lib/wardogs/panel.sqlite3
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - type: bind
        source: ../data
        target: /var/lib/wardogs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
