# Optional dedicated HTTP gateway for QQ bots. Tokens travel in cleartext.
# Keep the HTTPS panel and its PANEL_PUBLIC_ORIGIN unchanged.
server {
    listen 23334;
    server_name panel.example.com;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location ^~ /api/bot/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 23334;
        # This listener authenticates BotToken only, never panel sessions.
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        limit_except GET POST { deny all; }
    }

    location / { return 404; }
}
